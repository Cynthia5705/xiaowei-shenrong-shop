{% extends "base.html" %}
{% block title %}登录 — 小魏参茸土特产{% endblock %}

{% block content %}
<div class="auth-card card">
  <h1>登录</h1>
  <form method="post">
    <label>用户名或邮箱
      <input type="text" name="username" required autofocus>
    </label>
    <label>密码
      <input type="password" name="password" required>
    </label>
    <button class="btn btn-primary btn-block" type="submit">登录</button>
  </form>
  <p class="muted">还没有账号？<a href="{{ url_for('auth.register') }}">立即注册</a>。</p>
  <p class="muted small">演示管理员账号：<code>admin / admin123</code></p>
</div>
{% endblock %}
